name: Publish an already verified IPA
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful complete iOS 26/27 and backend verification run
        required: true
      commit_sha:
        description: Exact source commit of the verified package and tests
        required: true
      version:
        description: Expected version inside the verified IPA
        required: true
permissions:
  actions: read
  contents: write
concurrency:
  group: formscan-verified-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.run_id }}
      SOURCE_SHA: ${{ inputs.commit_sha }}
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the complete successful verification of integrated source
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9]+', os.environ['SOURCE_RUN'])
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['SOURCE_SHA'])
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', os.environ['EXPECTED_VERSION'])
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > source-jobs.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))
          assert run['head_sha'] == os.environ['SOURCE_SHA']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/build.yml'
          jobs = json.load(open('source-jobs.json'))['jobs']
          for key in ('macos-26', 'xcode-27', 'cloud_backend'):
              matching = [job for job in jobs if key in job['name']]
              assert len(matching) == 1 and matching[0]['conclusion'] == 'success', key
          print('Complete iOS 26, iOS 27 and private PostgreSQL verification passed')
          PY
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git diff --exit-code "$SOURCE_SHA" origin/main -- Sources Models Assets.xcassets Artwork Config project.yml Tests UITests Backend Scripts .github/workflows/build.yml
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: FormScan-build-and-verification-iOS27
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: verified
      - name: Validate the actual package and live service
        run: |
          mv verified/release release
          python3 - <<'PY'
          import os, pathlib, plistlib, zipfile
          files = list(pathlib.Path('release').glob('*.ipa'))
          assert len(files) == 1 and files[0].name == 'FormScan-' + os.environ['EXPECTED_VERSION'] + '.ipa'
          with zipfile.ZipFile(files[0]) as archive:
              info = plistlib.loads(archive.read('Payload/FormScan.app/Info.plist'))
          assert info['CFBundleShortVersionString'] == os.environ['EXPECTED_VERSION']
          assert info['DTSDKName'].startswith('iphoneos27')
          PY
          python3 Scripts/check_production_package.py "release/FormScan-$EXPECTED_VERSION.ipa"
          python3 Scripts/prepare_accounts.py --check-service
          cp Docs/Cloud.md Docs/Accounts.md Docs/Design.md Docs/iOS27.md release/
          cp verified/unit-tests.log verified/critical-ui-tests.log verified/simulator-tests.log release/
      - name: Publish and verify the exact tested download
        run: |
          TAG="v$EXPECTED_VERSION"
          cat > release-notes.md <<'NOTES'
          Acceso con Google y correo, guardado privado de PDF y campos, recuperación automática, edición sin conexión y conservación de ambas versiones ante cambios simultáneos. Se corrige el campo de texto duplicado sobre casillas. Análisis local automático y exportación del documento completado, con interfaz nativa para iOS 26 y 27.

          Verificado en cada simulador: 58 pruebas de datos y transporte y 14 recorridos de interfaz, incluyendo importación real desde Archivos, edición, exportación, casillas, tablas, recuperación tras eliminar la biblioteca local y reintento sin conexión. Diez pruebas adicionales de permisos y escrituras simultáneas en PostgreSQL 17. Registros y capturas adjuntos. La prueba de nube del simulador usa un servicio aislado, sin cuentas reales.

          Se ha comprobado en vivo la configuración pública de acceso y el almacenamiento privado. El inicio Google, la entrega SMTP y el ciclo de nube con una cuenta real en un iPhone físico requieren comprobación en el dispositivo. IPA sin firmar para SideStore. Actualiza sobre la instalación existente para conservar cambios locales pendientes.
          NOTES
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$SOURCE_SHA" --title "FormScan $EXPECTED_VERSION" --notes-file release-notes.md
          fi
          mkdir previous
          if gh release download "$TAG" --pattern "FormScan-$EXPECTED_VERSION.ipa" --dir previous; then
            cmp "previous/FormScan-$EXPECTED_VERSION.ipa" "release/FormScan-$EXPECTED_VERSION.ipa"
          fi
          gh release upload "$TAG" release/* --clobber
          mkdir downloaded
          gh release download "$TAG" --pattern "FormScan-$EXPECTED_VERSION.ipa" --dir downloaded
          cmp "downloaded/FormScan-$EXPECTED_VERSION.ipa" "release/FormScan-$EXPECTED_VERSION.ipa"
          python3 Scripts/release_source.py "downloaded/FormScan-$EXPECTED_VERSION.ipa" --output downloaded
          python3 - <<'PY'
          import json
          expected = json.load(open('release/source.json'))['apps'][0]
          actual = json.load(open('downloaded/source.json'))['apps'][0]
          for key in ('version', 'bundleIdentifier', 'downloadURL', 'size', 'minOSVersion'):
              assert expected[key] == actual[key], key
          for key in ('version', 'buildVersion', 'downloadURL', 'size', 'minOSVersion'):
              assert expected['versions'][0][key] == actual['versions'][0][key], key
          PY
          gh release edit "$TAG" --draft=false --latest --notes-file release-notes.md
      - name: Update matching SideStore feeds without downgrading a newer version
        run: |
          git fetch origin main
          git switch -C source-update origin/main
          python3 - <<'PY'
          import json, os, pathlib, shutil
          current = json.load(open('source.json'))['apps'][0]['version']
          incoming = os.environ['EXPECTED_VERSION']
          if tuple(map(int, current.split('.'))) > tuple(map(int, incoming.split('.'))):
              print('A newer version is already in the source; preserving it')
          else:
              for name in ('source.json', 'sidestore-v2.json'):
                  shutil.copyfile(pathlib.Path('release') / name, name)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json sidestore-v2.json
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize SideStore with verified IPA $EXPECTED_VERSION [skip ci]"
            git push origin HEAD:main
          fi

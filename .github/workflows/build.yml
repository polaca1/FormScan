name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Download open licensed offline model
        run: |
          mkdir -p Models
          curl --fail --location --retry 3 --output Models/model.onnx https://huggingface.co/nutrientdocs/form-field-v1-nano/resolve/main/model.onnx
          test $(stat -f%z Models/model.onnx) -gt 1000000
      - name: Generate project
        run: xcodegen generate
      - name: Build iPhone application
        run: xcodebuild -project FormScan.xcodeproj -scheme FormScan -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FormScan.app Payload/
          zip -qr FormScan-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FormScan-unsigned-IPA
          path: FormScan-unsigned.ipa

      - name: Publish latest SideStore IPA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest FormScan-unsigned.ipa --clobber
          else
            gh release create latest FormScan-unsigned.ipa --title "FormScan AI - Latest" --notes "Unsigned iOS IPA for SideStore; local ONNX AI included." --latest
          fi

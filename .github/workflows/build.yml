name: Build and verify iOS 26 and 27
on:
  push:
    branches: [main, codex/ios26-rebuild]
    paths-ignore: [source.json, sidestore-v2.json, README.md]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: formscan-ios26-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
            ios: '26'
          - runner: xcode-27
            xcode: '27.0'
            ios: '27'
    runs-on: ${{ matrix.runner }}
    env:
      SIMULATOR_OS_MAJOR: ${{ matrix.ios }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Verify Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and verify offline model catalogue
        run: |
          python3 -m pip install onnx==1.23.2 numpy==2.3.5 zstandard==0.25.0
          python3 Scripts/prepare_models.py
      - name: Generate adaptive app icons
        timeout-minutes: 3
        run: swift Scripts/GenerateIcon.swift
      - name: Generate project
        run: xcodegen generate
      - name: Build iPhone application
        run: |
          set -o pipefail
          xcodebuild -project FormScan.xcodeproj -scheme FormScan -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee device-build.log
      - name: Prepare candidate IPA
        run: |
          mkdir -p Payload candidate
          cp -R build/Build/Products/Release-iphoneos/FormScan.app Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/FormScan.app/Info.plist)
          zip -qr "candidate/FormScan-$VERSION.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FormScan-candidate-IPA-iOS${{ matrix.ios }}
          path: candidate/*.ipa
          retention-days: 5
      - name: Start installed iPhone simulator
        timeout-minutes: 10
        run: |
          set -o pipefail
          python3 -u Scripts/start_simulator.py | tee simulator-start.log
      - name: Verify actual Files import and a checked box first
        timeout-minutes: 12
        run: |
          set -o pipefail
          python3 -u Scripts/run_tests.py --expected 2 --log critical-ui-tests.log -- xcodebuild -project FormScan.xcodeproj -scheme FormScan -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -configuration Debug -derivedDataPath build-simulator -resultBundlePath CriticalUI.xcresult -only-testing:FormScanUITests/FormScanUITests/testImportActualPDFThroughFilesAndReopenIt -only-testing:FormScanUITests/FormScanUITests/testRepeatedModeChangesKeepToolbarStableAndCheckboxHasPrintedText -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 CODE_SIGNING_ALLOWED=NO test
      - name: Test PDF editing and three real offline models
        timeout-minutes: 10
        run: |
          set -o pipefail
          python3 -u Scripts/run_tests.py --expected 17 --log unit-tests.log -- xcodebuild -project FormScan.xcodeproj -scheme FormScan -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -configuration Debug -derivedDataPath build-simulator -resultBundlePath UnitTests.xcresult -only-testing:FormScanTests -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test
      - name: Test import, automatic analysis and native user interface
        timeout-minutes: 12
        run: |
          set -o pipefail
          python3 -u Scripts/run_tests.py --expected 9 --log simulator-tests.log -- xcodebuild -project FormScan.xcodeproj -scheme FormScan -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -configuration Debug -derivedDataPath build-simulator -resultBundlePath TestResults.xcresult -only-testing:FormScanUITests -skip-testing:FormScanUITests/FormScanUITests/testImportActualPDFThroughFilesAndReopenIt -skip-testing:FormScanUITests/FormScanUITests/testRepeatedModeChangesKeepToolbarStableAndCheckboxHasPrintedText -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test
      - name: Export UI screenshots
        if: always()
        run: |
          mkdir -p Screenshots
          if [ -d CriticalUI.xcresult ]; then
            python3 Scripts/export_screenshots.py CriticalUI.xcresult Screenshots/critical
          fi
          if [ -d TestResults.xcresult ]; then
            python3 Scripts/export_screenshots.py TestResults.xcresult Screenshots/standard
          fi
      - name: Package and verify IPA and sources
        run: |
          mkdir -p release
          /usr/libexec/PlistBuddy -c 'Print UILaunchScreen' Payload/FormScan.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/FormScan.app/Info.plist)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          cp "candidate/FormScan-$VERSION.ipa" release/
          cp Assets.xcassets/AppIcon.appiconset/AppIcon.png release/AppIcon.png
          cp ModelAssets/ffdetr-mobile-int8.onnx release/
          cp Docs/Models.md release/Models.md
          cp Sources/Resources/ThirdPartyNotices.txt release/
          python3 Scripts/release_source.py "release/FormScan-$VERSION.ipa"
          python3 - <<'PY'
          import json, pathlib, re, shutil
          root = pathlib.Path('Screenshots')
          count = 0
          for manifest_path in root.rglob('manifest.json'):
              manifest = json.loads(manifest_path.read_text())
              for case in manifest:
                  for attachment in case['attachments']:
                      match = re.match(r'(\d{2}-[a-z-]+)_', attachment['suggestedHumanReadableName'])
                      if match and attachment['exportedFileName'].endswith('.png'):
                          shutil.copyfile(manifest_path.parent / attachment['exportedFileName'], pathlib.Path('release') / (match[1] + '.png'))
                          count += 1
          assert count >= 8, 'Expected UI evidence from the simulator tests'
          print(f'Packaged {count} UI screenshots for review')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FormScan-build-and-verification-iOS${{ matrix.ios }}
          path: |
            release/
            Screenshots/
            TestResults.xcresult/
            UnitTests.xcresult/
            CriticalUI.xcresult/
            critical-ui-tests.log
            unit-tests.log
            *-build.log
            simulator-tests.log
            simulator-start.log
            Assets.xcassets/AppIcon.appiconset/*.png
          retention-days: 14
  publish:
    needs: ios
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FormScan-build-and-verification-iOS27
          path: verified
      - name: Prepare verified release
        run: |
          mv verified/release release
          VERSION=$(python3 -c "import json; print(json.load(open('release/source.json'))['apps'][0]['version'])")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish verified release and matching SideStore sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "FormScan $APP_VERSION" --notes "iOS 26 y 27 · Liquid Glass nativo · análisis automático · multi IA local · casillas vectoriales · campos sincronizados con el PDF. IPA sin firmar para SideStore. Pruebas de PDF, IA y UI en simulador incluidas en Actions." --latest
          mkdir release-check
          gh release download "$TAG" --pattern "FormScan-$APP_VERSION.ipa" --dir release-check
          python3 Scripts/release_source.py "release-check/FormScan-$APP_VERSION.ipa" --output release-check
          python3 - <<'PY'
          import json, hashlib, pathlib
          expected = json.load(open('release/source.json'))['apps'][0]
          actual = json.load(open('release-check/source.json'))['apps'][0]
          for key in ('version', 'bundleIdentifier', 'downloadURL', 'size', 'minOSVersion'):
              assert expected[key] == actual[key], f'Published IPA mismatch: {key}'
          filename = pathlib.Path(expected['downloadURL']).name
          assert hashlib.sha256((pathlib.Path('release') / filename).read_bytes()).digest() == hashlib.sha256((pathlib.Path('release-check') / filename).read_bytes()).digest()
          print('Published download verified against the SideStore source')
          PY
          git fetch origin main
          git switch -C source-update origin/main
          cp release/source.json source.json
          cp release/sidestore-v2.json sidestore-v2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json sidestore-v2.json
          git commit -m "Synchronize SideStore feeds with verified IPA $APP_VERSION [skip ci]"
          git push origin HEAD:main

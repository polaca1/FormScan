name: Build and verify iOS 26 and 27
on:
  push:
    branches: [main, codex/ios26-rebuild, codex/cloud-documents]
    paths-ignore: [source.json, sidestore-v2.json, README.md]
  workflow_dispatch:
    inputs:
      verified_ios26_run:
        description: 'Reuse a successful iOS 26 job only if all application/build inputs are unchanged'
        required: false
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: formscan-ios26-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloud_backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: formscan_test
          POSTGRES_PASSWORD: formscan-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'psycopg[binary]==3.2.9'
      - name: Verify private storage, account isolation and simultaneous commits
        env:
          FORMSCAN_TEST_DSN: host=127.0.0.1 port=5432 dbname=formscan_test user=postgres password=formscan-test-only
        run: python3 -m unittest discover -s Backend/tests -v
  ios:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.verified_ios26_run != '' && '[{"runner":"xcode-27","xcode":"27.0","ios":"27"}]' || '[{"runner":"macos-26","xcode":"26.6","ios":"26"},{"runner":"xcode-27","xcode":"27.0","ios":"27"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      SIMULATOR_OS_MAJOR: ${{ matrix.ios }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Validate unchanged application against the completed iOS 26 verification
        if: inputs.verified_ios26_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.verified_ios26_run }}
        run: |
          [[ "$VERIFIED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/jobs?per_page=100" > previous-ios26-jobs.json
          python3 - <<'PYVALIDATE'
          import json
          jobs = json.load(open('previous-ios26-jobs.json'))['jobs']
          matching = [job for job in jobs if 'macos-26' in job['name']]
          assert len(matching) == 1 and matching[0]['conclusion'] == 'success', 'A fully passing iOS 26 job is required'
          PYVALIDATE
          VERIFIED_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .head_sha)
          git fetch origin "$VERIFIED_SHA" --depth=1
          git diff --exit-code "$VERIFIED_SHA" HEAD -- Sources Models Assets.xcassets Artwork Config project.yml Scripts/prepare_models.py Scripts/prepare_accounts.py Scripts/GenerateIcon.swift
          echo "Reusing the complete passing iOS 26 verification of unchanged application inputs: $VERIFIED_SHA"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Verify Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and verify offline model catalogue
        run: |
          python3 -m pip install onnx==1.23.2 numpy==2.3.5 zstandard==0.25.0
          python3 Scripts/prepare_models.py
      - name: Prepare public account configuration
        run: python3 Scripts/prepare_accounts.py
      - name: Generate adaptive app icons
        timeout-minutes: 3
        run: swift Scripts/GenerateIcon.swift
      - name: Generate project
        run: xcodegen generate
      - name: Build iPhone application
        run: |
          set -o pipefail
          xcodebuild -project FormScan.xcodeproj -scheme FormScan -sdk iphoneos -destination 'generic/platform=iOS' -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee device-build.log
      - name: Prepare candidate IPA
        run: |
          mkdir -p Payload candidate
          cp -R build/Build/Products/Release-iphoneos/FormScan.app Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/FormScan.app/Info.plist)
          zip -qr "candidate/FormScan-$VERSION.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FormScan-candidate-IPA-iOS${{ matrix.ios }}
          path: candidate/*.ipa
          retention-days: 5
      - name: Start installed iPhone simulator
        timeout-minutes: 10
        run: |
          set -o pipefail
          python3 -u Scripts/start_simulator.py | tee simulator-start.log
      - name: Test PDF editing and three real offline models
        timeout-minutes: 20
        run: |
          set -o pipefail
          python3 -u Scripts/run_tests.py --expected 64 --log unit-tests.log -- xcodebuild -project FormScan.xcodeproj -scheme FormScan -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -configuration Debug -derivedDataPath build-simulator -resultBundlePath UnitTests.xcresult -only-testing:FormScanTests -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test
      - name: Verify first launch, Files import, cloud recovery and checked boxes
        timeout-minutes: 12
        run: |
          set -o pipefail
          python3 -u Scripts/run_tests.py --expected 5 --log critical-ui-tests.log -- xcodebuild -project FormScan.xcodeproj -scheme FormScan -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -configuration Debug -derivedDataPath build-simulator -resultBundlePath CriticalUI.xcresult -only-testing:FormScanUITests/FormScanUITests/testFirstLaunchAccessValidationAndExample -only-testing:FormScanUITests/FormScanUITests/testImportActualPDFThroughFilesAndReopenIt -only-testing:FormScanUITests/FormScanUITests/testPrivateCloudRestoreEditFreshInstallationAndRetry -only-testing:FormScanUITests/FormScanUITests/testRepeatedModeChangesKeepToolbarStableAndCheckboxHasPrintedText -only-testing:FormScanUITests/FormScanUITests/testTypingAcrossScannedPagesSwitchesAndRestoresWithoutLosingCharacters -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 CODE_SIGNING_ALLOWED=NO test
      - name: Test import, automatic analysis and native user interface
        timeout-minutes: 12
        run: |
          set -o pipefail
          python3 -u Scripts/run_tests.py --expected 10 --log simulator-tests.log -- xcodebuild -project FormScan.xcodeproj -scheme FormScan -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -destination-timeout 120 -configuration Debug -derivedDataPath build-simulator -resultBundlePath TestResults.xcresult -only-testing:FormScanUITests -skip-testing:FormScanUITests/FormScanUITests/testFirstLaunchAccessValidationAndExample -skip-testing:FormScanUITests/FormScanUITests/testImportActualPDFThroughFilesAndReopenIt -skip-testing:FormScanUITests/FormScanUITests/testPrivateCloudRestoreEditFreshInstallationAndRetry -skip-testing:FormScanUITests/FormScanUITests/testRepeatedModeChangesKeepToolbarStableAndCheckboxHasPrintedText -skip-testing:FormScanUITests/FormScanUITests/testTypingAcrossScannedPagesSwitchesAndRestoresWithoutLosingCharacters -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 CODE_SIGNING_ALLOWED=NO test
      - name: Export UI screenshots
        if: always()
        run: |
          mkdir -p Screenshots
          if [ -d CriticalUI.xcresult ]; then
            python3 Scripts/export_screenshots.py CriticalUI.xcresult Screenshots/critical
          fi
          if [ -d TestResults.xcresult ]; then
            python3 Scripts/export_screenshots.py TestResults.xcresult Screenshots/standard
          fi
      - name: Package and verify IPA and sources
        run: |
          mkdir -p release
          /usr/libexec/PlistBuddy -c 'Print UILaunchScreen' Payload/FormScan.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/FormScan.app/Info.plist)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          cp "candidate/FormScan-$VERSION.ipa" release/
          cp Assets.xcassets/AppIcon.appiconset/AppIcon.png release/AppIcon.png
          cp ModelAssets/ffdetr-mobile-int8.onnx release/
          cp Docs/Models.md release/Models.md
          cp Sources/Resources/ThirdPartyNotices.txt release/
          python3 Scripts/check_production_package.py "release/FormScan-$VERSION.ipa"
          python3 Scripts/release_source.py "release/FormScan-$VERSION.ipa"
          python3 - <<'PY'
          import json, pathlib, re, shutil
          root = pathlib.Path('Screenshots')
          count = 0
          for manifest_path in root.rglob('manifest.json'):
              manifest = json.loads(manifest_path.read_text())
              for case in manifest:
                  for attachment in case['attachments']:
                      match = re.match(r'(\d{2}-[a-z-]+)_', attachment['suggestedHumanReadableName'])
                      if match and attachment['exportedFileName'].endswith('.png'):
                          shutil.copyfile(manifest_path.parent / attachment['exportedFileName'], pathlib.Path('release') / (match[1] + '.png'))
                          count += 1
          assert count >= 8, 'Expected UI evidence from the simulator tests'
          print(f'Packaged {count} UI screenshots for review')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FormScan-build-and-verification-iOS${{ matrix.ios }}
          path: |
            release/
            Screenshots/
            TestResults.xcresult/
            UnitTests.xcresult/
            CriticalUI.xcresult/
            critical-ui-tests.log
            unit-tests.log
            *-build.log
            simulator-tests.log
            simulator-start.log
            Assets.xcassets/AppIcon.appiconset/*.png
          retention-days: 14
  publish:
    needs: [ios, cloud_backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FormScan-build-and-verification-iOS27
          path: verified
      - name: Prepare verified release
        run: |
          mv verified/release release
          VERSION=$(python3 -c "import json; print(json.load(open('release/source.json'))['apps'][0]['version'])")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Check account service before publishing
        run: python3 Scripts/prepare_accounts.py --check-service
      - name: Publish verified release and matching SideStore sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "FormScan $APP_VERSION" --notes "iOS 26 y 27 · Google y correo · guardado privado y recuperación de documentos · edición sin conexión y conservación de conflictos · casillas corregidas · análisis local y exportación PDF. IPA sin firmar para SideStore. Pruebas de permisos PostgreSQL, PDF, IA, transporte y UI en simulador incluidas en Actions. El acceso Google, la entrega de correo y el ciclo de nube en un dispositivo físico requieren comprobación con una cuenta real." --latest
          mkdir release-check
          gh release download "$TAG" --pattern "FormScan-$APP_VERSION.ipa" --dir release-check
          python3 Scripts/release_source.py "release-check/FormScan-$APP_VERSION.ipa" --output release-check
          python3 - <<'PY'
          import json, hashlib, pathlib
          expected = json.load(open('release/source.json'))['apps'][0]
          actual = json.load(open('release-check/source.json'))['apps'][0]
          for key in ('version', 'bundleIdentifier', 'downloadURL', 'size', 'minOSVersion'):
              assert expected[key] == actual[key], f'Published IPA mismatch: {key}'
          filename = pathlib.Path(expected['downloadURL']).name
          assert hashlib.sha256((pathlib.Path('release') / filename).read_bytes()).digest() == hashlib.sha256((pathlib.Path('release-check') / filename).read_bytes()).digest()
          print('Published download verified against the SideStore source')
          PY
          git fetch origin main
          git switch -C source-update origin/main
          cp release/source.json source.json
          cp release/sidestore-v2.json sidestore-v2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json sidestore-v2.json
          git commit -m "Synchronize SideStore feeds with verified IPA $APP_VERSION [skip ci]"
          git push origin HEAD:main

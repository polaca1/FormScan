name: FormScan
options:
  bundleIdPrefix: com.polaca1
settings:
  base:
    SWIFT_VERSION: '5.9'
    GENERATE_INFOPLIST_FILE: YES
packages:
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.20.0
targets:
  FormScan:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources: [Sources, Models, Assets.xcassets]
    dependencies:
      - package: ONNXRuntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polaca1.formscan
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: "Escanear documentos"
        TARGETED_DEVICE_FAMILY: '1,2'

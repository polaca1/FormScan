name: FormScan
options:
  bundleIdPrefix: com.polaca1
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
packages:
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.20.0
targets:
  FormScan:
    type: application
    platform: iOS
    deploymentTarget: '26.0'
    sources: [Sources, Models, Assets.xcassets]
    dependencies:
      - package: ONNXRuntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polaca1.formscan
        MARKETING_VERSION: '2.1.0'
        CURRENT_PROJECT_VERSION: '22'
        INFOPLIST_KEY_CFBundleDisplayName: FormScan
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: "Escanear documentos"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  FormScanTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '26.0'
    sources: [Tests]
    dependencies:
      - target: FormScan
  FormScanUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '26.0'
    sources: [UITests]
    dependencies:
      - target: FormScan
schemes:
  FormScan:
    build:
      targets:
        FormScan: all
    test:
      targets: [FormScanTests, FormScanUITests]

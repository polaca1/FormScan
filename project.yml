name: FormScan
options:
  bundleIdPrefix: com.polaca1
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    'SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27*]': '$(inherited) IOS27_SDK'
    'SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27*]': '$(inherited) IOS27_SDK'
packages:
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.20.0
targets:
  FormScan:
    type: application
    platform: iOS
    deploymentTarget: '26.0'
    sources: [Sources, Models, Assets.xcassets]
    dependencies:
      - package: ONNXRuntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polaca1.formscan
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        MARKETING_VERSION: '2.2.1'
        CURRENT_PROJECT_VERSION: '25'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
  FormScanTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '26.0'
    sources: [Tests]
    dependencies:
      - target: FormScan
  FormScanUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '26.0'
    sources: [UITests]
    dependencies:
      - target: FormScan
schemes:
  FormScan:
    build:
      targets:
        FormScan: all
    test:
      targets: [FormScanTests, FormScanUITests]
